name: Stingray Dartscorer regression checks

on:
  push:
    paths:
      - 'stingrays_v2/**'
      - 'dart_engine.py'
      - 'dart_ui/**'
      - 'tests/**'
      - 'tests_js/**'
      - 'tests_browser/**'
      - '.github/workflows/stingrays-quality.yml'
  pull_request:
    paths:
      - 'stingrays_v2/**'
      - 'dart_engine.py'
      - 'dart_ui/**'
      - 'tests/**'
      - 'tests_js/**'
      - 'tests_browser/**'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install 'aiohttp>=3.9,<4' playwright
      - name: Compile Python files
        run: python -m compileall -q stingrays_v2 dart_engine.py
      - name: Check JavaScript syntax
        run: |
          for js in stingrays_v2/*.js dart_ui/*.js; do node --check "$js"; done
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Scoring and specialty regression tests
        run: node --test tests_js/*.test.js
      - name: Install Chromium for offline browser smoke checks
        run: python -m playwright install --with-deps chromium
      - name: Desktop and mobile UI smoke tests
        run: python tests_browser/smoke.py
      - name: Tournament center and simulation UI smoke tests
        run: python tests_browser/tournament_center_smoke.py

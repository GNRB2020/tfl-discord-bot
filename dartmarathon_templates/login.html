<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Dartmarathon Control – Login</title>
  <link rel="stylesheet" href="/dartmarathon/static/control.css?v=5.4.0">
</head>
<body class="login-body">
  <main class="login-wrap">
    <form class="login-card" method="post" action="/dartmarathon/login">
      <div class="login-lock" aria-hidden="true">LOCK</div>
      <div class="eyebrow">TZMARTY VS. KORSAR · DAS REVIVAL</div>
      <h1>CONTROL CENTER</h1>
      <p class="login-copy">Geschützter Bereich. Kennwort eingeben, um das Control Center zu öffnen.</p>

      <!--LOGIN_ERROR-->

      <label class="login-field">
        <span>KENNWORT</span>
        <input
          type="password"
          name="password"
          placeholder="Kennwort"
          required
          autofocus
          autocomplete="current-password"
        >
      </label>

      <button class="btn positive login-submit" type="submit">CONTROL CENTER ÖFFNEN</button>
    </form>
  </main>
</body>
</html>
